<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI IT Support Assistant
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

    <main class="container">


        <header class="header">

            <h1>
                AI IT Support Assistant
            </h1>

            <p>
                Get fast, AI-powered troubleshooting
                help for your technical problems.
            </p>

        </header>



        <section class="card">

            <label for="question">
                Technical Support Question
            </label>


            <textarea
                id="question"
                maxlength="1000"
                placeholder="Describe your technical problem here..."
                autocomplete="off"
            ></textarea>


            <div class="input-footer">

                <span id="character-count">
                    0 / 1000
                </span>


                <button id="submit-button">

                    Get Troubleshooting Help

                </button>

            </div>


            <p
                id="error-message"
                class="error hidden"
            ></p>

        </section>



        <section
            id="loading"
            class="card loading hidden"
        >

            Processing your support request...

        </section>



        <section
            id="result"
            class="hidden"
        >

            <div class="card">

                <div class="result-header">

                    <h2>
                        Troubleshooting Solution
                    </h2>

                </div>


                <div id="answer"></div>

            </div>

        </section>


    </main>


    <script src="/static/app.js"></script>

</body>

</html>
